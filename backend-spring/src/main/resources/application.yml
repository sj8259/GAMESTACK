server:
  port: ${PORT:3001}

spring:
  application:
    name: gamestack-backend
  main:
    allow-bean-definition-overriding: true
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gamestack}
      auto-index-creation: false
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  
  security:
    jwt:
      secret: ${JWT_SECRET:your_jwt_secret_key_here_make_it_long_and_secure_at_least_64_characters_long_for_hs512_algorithm}
      expiration: 604800000 # 7 days in milliseconds
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            # Disable OAuth if credentials not provided
            enabled: ${GOOGLE_OAUTH_ENABLED:false}
  
app:
  name: GameStack

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.gamestack: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
