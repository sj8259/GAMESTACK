<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStack Data Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .auth-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .auth-section h3 { color: #667eea; margin-bottom: 15px; }
        .auth-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .auth-input-group input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .auth-input-group button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .auth-input-group button:hover { background: #5568d3; }
        .auth-input-group button.clear-btn { background: #dc3545; }
        .auth-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .auth-status.authenticated {
            background: #d4edda;
            color: #155724;
        }
        .auth-status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h3 { color: #667eea; margin-bottom: 10px; font-size: 0.9em; text-transform: uppercase; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #333; }
        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .section h2 { color: #667eea; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #667eea; font-weight: 600; text-transform: uppercase; font-size: 0.85em; }
        tr:hover { background: #f8f9fa; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .info { background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            float: right;
        }
        .refresh-btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GameStack Data Viewer</h1>
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        <div style="clear: both;"></div>

        <div class="auth-section">
            <h3>🔐 Admin Authentication (Optional)</h3>
            <p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">
                Enter your JWT token to view user data and admin statistics. Get your token by logging in via <code>/api/auth/login</code>
            </p>
            <div class="auth-input-group">
                <input type="password" id="authToken" placeholder="Enter JWT Bearer token..." />
                <button onclick="setAuthToken()">Set Token</button>
                <button onclick="clearAuthToken()" class="clear-btn">Clear</button>
            </div>
            <div id="authStatus"></div>
        </div>

        <div class="stats-grid" id="stats">
            <div class="loading">Loading statistics...</div>
        </div>

        <div class="section">
            <h2>👥 Users</h2>
            <div id="users"><div class="loading">Loading users...</div></div>
        </div>

        <div class="section">
            <h2>📚 Lessons</h2>
            <div id="lessons"><div class="loading">Loading lessons...</div></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('gamestack_admin_token') || '';

        window.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                document.getElementById('authToken').value = authToken;
                updateAuthStatus('authenticated', 'Token loaded from storage');
            }
        });

        function setAuthToken() {
            const tokenInput = document.getElementById('authToken');
            authToken = tokenInput.value.trim();
            if (authToken) {
                localStorage.setItem('gamestack_admin_token', authToken);
                updateAuthStatus('authenticated', 'Token saved! Loading user data...');
                loadData();
            } else {
                updateAuthStatus('error', 'Please enter a token');
            }
        }

        function clearAuthToken() {
            authToken = '';
            document.getElementById('authToken').value = '';
            localStorage.removeItem('gamestack_admin_token');
            updateAuthStatus('', '');
            loadData();
        }

        function updateAuthStatus(type, message) {
            const statusDiv = document.getElementById('authStatus');
            if (type && message) {
                statusDiv.className = `auth-status ${type}`;
                statusDiv.textContent = message;
            } else {
                statusDiv.className = '';
                statusDiv.textContent = '';
            }
        }

        async function fetchWithAuth(url) {
            const headers = { 'Content-Type': 'application/json' };
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }
            const response = await fetch(url, { headers });
            return response;
        }

        async function loadData() {
            try {
                const lessonsRes = await fetch(API_BASE + '/api/lessons');
                if (lessonsRes.ok) {
                    const lessonsData = await lessonsRes.json();
                    displayLessons(lessonsData.lessons || []);
                }

                if (authToken) {
                    try {
                        const statsRes = await fetchWithAuth(API_BASE + '/api/admin/stats');
                        if (statsRes.ok) {
                            const statsData = await statsRes.json();
                            displayStats(statsData.stats);
                        } else if (statsRes.status === 403) {
                            updateAuthStatus('error', 'Token is invalid or expired. Please login again.');
                        }
                    } catch (e) {
                        console.error('Error loading stats:', e);
                    }

                    try {
                        const usersRes = await fetchWithAuth(API_BASE + '/api/admin/users');
                        if (usersRes.ok) {
                            const usersData = await usersRes.json();
                            displayUsers(usersData.users || []);
                        } else if (usersRes.status === 403) {
                            document.getElementById('users').innerHTML = '<div class="error">Access denied. Token may be invalid or expired.</div>';
                        }
                    } catch (e) {
                        console.error('Error loading users:', e);
                        document.getElementById('users').innerHTML = '<div class="error">Failed to load users: ' + e.message + '</div>';
                    }
                } else {
                    const lessonsRes = await fetch(API_BASE + '/api/lessons');
                    if (lessonsRes.ok) {
                        const lessonsData = await lessonsRes.json();
                        const lessons = lessonsData.lessons || [];
                        displayStatsFromLessons(lessons);
                    }
                    document.getElementById('users').innerHTML = '<div class="info">👆 Enter your admin JWT token above to view user data and statistics.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayStats(stats) {
            if (!stats) return;
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value">${stats.totalUsers || 0}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Lessons</h3>
                    <div class="value">${stats.totalLessons || 0}</div>
                </div>
                <div class="stat-card">
                    <h3>Published</h3>
                    <div class="value">${stats.publishedLessons || 0}</div>
                </div>
                <div class="stat-card">
                    <h3>Drafts</h3>
                    <div class="value">${stats.draftLessons || 0}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Completions</h3>
                    <div class="value">${stats.totalCompletedLessons || 0}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Score</h3>
                    <div class="value">${stats.totalScore || 0}</div>
                </div>
            `;
        }

        function displayStatsFromLessons(lessons) {
            const total = lessons.length;
            const published = lessons.filter(l => l.isPublished).length;
            const drafts = total - published;
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>Total Lessons</h3>
                    <div class="value">${total}</div>
                </div>
                <div class="stat-card">
                    <h3>Published</h3>
                    <div class="value">${published}</div>
                </div>
                <div class="stat-card">
                    <h3>Drafts</h3>
                    <div class="value">${drafts}</div>
                </div>
            `;
        }

        function displayUsers(users) {
            if (!users || users.length === 0) {
                document.getElementById('users').innerHTML = '<p>No users found.</p>';
                return;
            }

            let html = '<table><thead><tr><th>Username</th><th>Email</th><th>Admin</th><th>Score</th><th>Level</th><th>Completed</th><th>Created</th></tr></thead><tbody>';
            users.forEach(user => {
                const progress = user.progress || {};
                const completedCount = progress.completedLessonsCount || 0;
                const score = progress.totalScore || 0;
                const level = progress.currentLevel || 1;
                const createdAt = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A';
                
                html += `<tr>
                    <td><strong>${user.username || 'N/A'}</strong></td>
                    <td>${user.email || 'N/A'}</td>
                    <td>${user.isAdmin ? '<span class="badge badge-success">Admin</span>' : '<span class="badge badge-info">User</span>'}</td>
                    <td>${score}</td>
                    <td>${level}</td>
                    <td>${completedCount}</td>
                    <td>${createdAt}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('users').innerHTML = html;
        }

        function displayLessons(lessons) {
            if (!lessons || lessons.length === 0) {
                document.getElementById('lessons').innerHTML = '<p>No lessons found.</p>';
                return;
            }

            let html = '<table><thead><tr><th>Title</th><th>Level</th><th>Difficulty</th><th>Status</th><th>Gems</th><th>Concepts</th></tr></thead><tbody>';
            lessons.forEach(lesson => {
                const status = lesson.isPublished 
                    ? '<span class="badge badge-success">Published</span>' 
                    : '<span class="badge badge-warning">Draft</span>';
                const gems = lesson.worldState?.gems?.length || 0;
                const concepts = lesson.concepts?.join(', ') || 'None';
                html += `<tr>
                    <td><strong>${lesson.title || 'Untitled'}</strong></td>
                    <td>${lesson.level || 1}</td>
                    <td><span class="badge badge-info">${lesson.difficulty || 'N/A'}</span></td>
                    <td>${status}</td>
                    <td>${gems}</td>
                    <td>${concepts}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('lessons').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tokenInput = document.getElementById('authToken');
            if (tokenInput) {
                tokenInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        setAuthToken();
                    }
                });
            }
            loadData();
        });
    </script>
</body>
</html>
