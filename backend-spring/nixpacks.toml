# Nixpacks configuration for Railway
# This explicitly tells Nixpacks this is a Java/Maven project

[phases.setup]
nixPkgs = ["jdk17", "maven"]

[phases.install]
cmds = ["mvn dependency:go-offline -B"]

[phases.build]
cmds = ["mvn clean package -DskipTests"]

[start]
cmd = "java -jar target/gamestack-backend-1.0.0.jar"

