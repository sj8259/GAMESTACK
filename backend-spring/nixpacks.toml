# Nixpacks configuration for Railway
# This explicitly tells Nixpacks this is a Java/Maven project

[phases.setup]
nixPkgs = ["jdk17", "maven"]

[phases.install]
cmds = ["mvn dependency:go-offline -B"]

[phases.build]
cmds = ["mvn clean package -DskipTests", "ls -la target/ || echo 'Target directory not found'"]

[start]
cmd = "bash start.sh"

