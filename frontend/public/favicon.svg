<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad1)"/>
  <!-- Game Controller Body -->
  <rect x="18" y="38" width="64" height="34" rx="10" fill="white" opacity="0.95"/>
  <!-- Controller Buttons -->
  <circle cx="33" cy="55" r="6" fill="#3b82f6"/>
  <circle cx="67" cy="55" r="6" fill="#8b5cf6"/>
  <!-- Code Brackets (more prominent) -->
  <path d="M 28 48 L 22 55 L 28 62" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72 48 L 78 55 L 72 62" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small accent dots -->
  <circle cx="50" cy="42" r="2" fill="#3b82f6" opacity="0.6"/>
  <circle cx="50" cy="68" r="2" fill="#8b5cf6" opacity="0.6"/>
</svg>

