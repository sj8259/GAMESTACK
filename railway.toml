# Railway Configuration File
# This file configures Railway to build and deploy the backend from backend-spring directory

[build]
builder = "NIXPACKS"
rootDirectory = "backend-spring"
# Note: buildCommand is defined in backend-spring/nixpacks.toml

[deploy]
startCommand = "sh start.sh || java -jar target/gamestack-backend-1.0.0.jar || java -jar target/*.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

